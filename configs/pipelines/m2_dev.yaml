# M2 dev sweep (250 dev questions), iteration 3: lexical grounding gate on re-citation, "v."
# abbreviation fix, revise threshold sweep at K=10 (iteration 2 picked K=10).
# __RETRIEVAL__ = dev-selected hybrid+rerank + two-hop splice; `hops: 1` turns the second hop off.
# Names follow <prompt>_k<K>[_<policy>_t<tau*100>] so `rageval gen choose` can parse them.
base:
  retrieval: __RETRIEVAL__
  context_k: 10
  prompt: zero_shot
  verify: none
pipelines:
  s0_naive_fused_k10: {retrieval: {hops: 1, rerank: false}, prompt: naive}
  s1_naive_rerank_k10: {retrieval: {hops: 1}, prompt: naive}
  s1_naive_2hop_k10: {prompt: naive}
  zero_k5: {context_k: 5}
  zero_k10: {}
  few_k10: {prompt: few_shot}
  cot_k10: {prompt: cot}
  zero_k10_revise_t50: {verify: revise, verify_tau: 0.5}
  zero_k10_revise_t70: {verify: revise, verify_tau: 0.7}
  zero_k10_revise_t90: {verify: revise, verify_tau: 0.9}
  few_k10_revise_t50: {prompt: few_shot, verify: revise, verify_tau: 0.5}
  few_k10_revise_t70: {prompt: few_shot, verify: revise, verify_tau: 0.7}
  few_k10_revise_t90: {prompt: few_shot, verify: revise, verify_tau: 0.9}
  cot_k10_revise_t50: {prompt: cot, verify: revise, verify_tau: 0.5}
  cot_k10_revise_t70: {prompt: cot, verify: revise, verify_tau: 0.7}
  cot_k10_revise_t90: {prompt: cot, verify: revise, verify_tau: 0.9}
