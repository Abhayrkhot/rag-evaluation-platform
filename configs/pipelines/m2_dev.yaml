# M2 dev sweep (250 dev questions), iteration 4: meta sentences ("... is not directly mentioned")
# are abstentions, citation minimisation at the plain NLI threshold, and an ensemble verifier
# (DeBERTa NLI and MiniCheck must both accept; policy name "revens" = revise with the ensemble).
# __RETRIEVAL__ = dev-selected hybrid+rerank + two-hop splice; `hops: 1` turns the second hop off.
base:
  retrieval: __RETRIEVAL__
  context_k: 10
  prompt: zero_shot
  verify: none
pipelines:
  s0_naive_fused_k10: {retrieval: {hops: 1, rerank: false}, prompt: naive}
  s1_naive_rerank_k10: {retrieval: {hops: 1}, prompt: naive}
  s1_naive_2hop_k10: {prompt: naive}
  zero_k5: {context_k: 5}
  zero_k10: {}
  few_k10: {prompt: few_shot}
  cot_k10: {prompt: cot}
  zero_k10_revise_t90: {verify: revise, verify_tau: 0.9}
  few_k10_revise_t90: {prompt: few_shot, verify: revise, verify_tau: 0.9}
  zero_k10_revens_t50: {verify: revise, verify_tau: 0.5, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
  zero_k10_revens_t70: {verify: revise, verify_tau: 0.7, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
  zero_k10_revens_t90: {verify: revise, verify_tau: 0.9, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
  few_k10_revens_t70: {prompt: few_shot, verify: revise, verify_tau: 0.7, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
  few_k10_revens_t90: {prompt: few_shot, verify: revise, verify_tau: 0.9, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
  cot_k10_revens_t90: {prompt: cot, verify: revise, verify_tau: 0.9, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
