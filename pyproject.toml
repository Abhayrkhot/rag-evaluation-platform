[project]
name = "rageval"
version = "0.1.0"
description = "Production RAG with an evaluation platform: hybrid retrieval (FAISS + BM25 + reranking), grounded generation with verified citations, LangGraph agent serving, and paired-test evaluation of retrieval, grounding and latency."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Abhay Khot" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "orjson>=3.10",
  "httpx>=0.27",
  "bm25s>=0.2.6",
  "PyStemmer>=2.2",
  "faiss-cpu>=1.8",
  "langgraph>=0.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Local (in-process) embedding / reranking / NLI models. Explorer runs these on top of the
# vLLM image's torch; the box dev container uses CPU torch.
models = [
  "torch>=2.4",
  "transformers>=4.51",
  "sentencepiece>=0.2",
  "protobuf>=5",
]
data = [
  "datasets>=3.0",
  "huggingface-hub>=0.24",
  "pyarrow>=16",
]

[project.scripts]
rageval = "rageval.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rageval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
files = ["src/rageval"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
