# M2/M3 on the 500-question test suite. Every setting below was fixed on dev:
#   {"alpha": 0.7, "ef_search": 256, "fusion": "weighted", "hop2_depth": 30, "hop2_keep": 2, "hop2_take": 1, "hops": 2, "plan_k": 5, "rerank": true, "rerank_blend": 0.0, "rerank_depth": 100}  hybrid+rerank (results/m1/selected.json) + two-hop splice (results/m1/multihop_dev.json)
#   10, cot, revise, 0.9, few_shot, null (balanced) and few_shot,
#   0.9, "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large" (strict) from results/m2/test_choices.json (gen choose)
base:
  retrieval: {"alpha": 0.7, "ef_search": 256, "fusion": "weighted", "hop2_depth": 30, "hop2_keep": 2, "hop2_take": 1, "hops": 2, "plan_k": 5, "rerank": true, "rerank_blend": 0.0, "rerank_depth": 100}
  context_k: 10
  prompt: zero_shot
  verify: none
pipelines:
  # citation-precision stages (S3 is the dev-picked prompt among the three below)
  s0_baseline: {retrieval: {hops: 1, rerank: false}, context_k: 10, prompt: naive}
  s1a_rerank: {retrieval: {hops: 1}, prompt: naive}
  s1b_2hop: {prompt: naive}
  s4_verified: {prompt: few_shot, verify: revise, verify_tau: 0.9, verifier: null}
  # strict operating point: highest dev citation precision regardless of correctness
  s4_strict: {prompt: few_shot, verify: revise, verify_tau: 0.9, verifier: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli+lytang/MiniCheck-DeBERTa-v3-Large"}
  # prompt strategies (M3): identical contexts, paired comparisons
  zero_shot: {}
  few_shot: {prompt: few_shot}
  cot: {prompt: cot}
