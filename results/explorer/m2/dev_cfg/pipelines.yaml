# M2 dev sweep (250 dev questions). Every choice used on the test suite is made here.
# {"alpha": 0.7, "ef_search": 256, "fusion": "weighted", "hop2_depth": 30, "hop2_keep": 2, "hop2_take": 1, "hops": 2, "plan_k": 5, "rerank": true, "rerank_blend": 0.0, "rerank_depth": 100} is the dev-selected hybrid+rerank config (results/m1/selected.json) plus the
# dev-selected two-hop splice (results/m1/multihop_dev.json); `hops: 1` turns the second hop off.
base:
  retrieval: {"alpha": 0.7, "ef_search": 256, "fusion": "weighted", "hop2_depth": 30, "hop2_keep": 2, "hop2_take": 1, "hops": 2, "plan_k": 5, "rerank": true, "rerank_blend": 0.0, "rerank_depth": 100}
  context_k: 5
  prompt: zero_shot
  verify: none
pipelines:
  # citation-precision stages
  s0_naive_fused_k10: {retrieval: {hops: 1, rerank: false}, context_k: 10, prompt: naive}
  s1_naive_rerank_k10: {retrieval: {hops: 1}, context_k: 10, prompt: naive}
  s1_naive_2hop_k10: {context_k: 10, prompt: naive}
  s1_naive_2hop_k5: {context_k: 5, prompt: naive}
  # retrieval and context size under the rules prompt
  zero_1hop_k5: {retrieval: {hops: 1}}
  zero_k3: {context_k: 3}
  zero_k5: {}
  zero_k10: {context_k: 10}
  # prompt strategies
  few_k5: {prompt: few_shot}
  cot_k5: {prompt: cot}
  # verifier policy and threshold
  zero_k5_repair_t50: {verify: repair, verify_tau: 0.5}
  zero_k5_prune_t30: {verify: prune, verify_tau: 0.3}
  zero_k5_prune_t50: {verify: prune, verify_tau: 0.5}
  zero_k5_prune_t70: {verify: prune, verify_tau: 0.7}
  few_k5_prune_t50: {prompt: few_shot, verify: prune, verify_tau: 0.5}
  cot_k5_prune_t50: {prompt: cot, verify: prune, verify_tau: 0.5}
